services:
  web:
    ports:
      - "443:8443"
    volumes:
      - ./web/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SEMIKB_CERTBOT_ROOT:-/opt/semiconductor-agent-knowledge-base-certbot}/www:/var/www/certbot:ro
      - ${SEMIKB_CERTBOT_ROOT:-/opt/semiconductor-agent-knowledge-base-certbot}/conf:/etc/letsencrypt:ro
    group_add:
      - "0"
