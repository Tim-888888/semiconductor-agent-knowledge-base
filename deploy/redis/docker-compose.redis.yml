name: semikb-redis

services:
  redis:
    image: redis:7.4-alpine
    container_name: semikb-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --appendfsync everysec
        --protected-mode yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "${REDIS_BIND_ADDRESS:?Set REDIS_BIND_ADDRESS in .env}:6379:6379"
    volumes:
      - semikb_redis_data:/data
    networks:
      - semikb_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  semikb_redis_data:
    name: semikb-redis-data

networks:
  semikb_network:
    name: semikb-network
