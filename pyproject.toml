[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "semiconductor-agent-knowledge-base"
version = "0.1.0"
description = "Evidence-driven semiconductor Agent knowledge base."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "langgraph-checkpoint-mongodb>=0.4,<0.5",
  "langgraph-store-mongodb>=0.3,<0.4",
  "minio>=7.2,<8",
  "mcp>=1.0,<2",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.9,<3",
  "pymilvus>=2.5,<3",
  "pymongo>=4.10,<5",
  "python-multipart>=0.0.9,<1",
  "redis>=5.2,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
[tool.hatch.build.targets.wheel]
packages = ["src/semikb"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
